name: esm_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.3.0       # Pinned for compatibility with the wheels below
  - torchvision
  - torchaudio
  - cpuonly             # CRITICAL: Forces CPU versions of PyTorch
  - jq
  - pip
  - pip:
    - fair-esm
    - biotite
    - "numpy<2"
    - torch-geometric
    # Install CPU-specific extensions directly from PyG wheels
    # This prevents Conda from pulling CUDA-linked binaries by mistake
    - torch-scatter -f https://data.pyg.org/whl/torch-2.3.0+cpu.html
    - torch-sparse -f https://data.pyg.org/whl/torch-2.3.0+cpu.html
    - torch-cluster -f https://data.pyg.org/whl/torch-2.3.0+cpu.html
    - torch-spline-conv -f https://data.pyg.org/whl/torch-2.3.0+cpu.html